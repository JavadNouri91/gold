version: '3.9'

services:
  # ─────────────────────────────────────────
  # PostgreSQL — primary database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gold_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gold_db
      POSTGRES_USER: gold_user
      POSTGRES_PASSWORD: gold_pass
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gold_user -d gold_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # NestJS API
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: gold_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Must match the uploads_data volume mount below.
      STORAGE_LOCAL_ROOT: /opt/gold/data/uploads
    ports:
      - '4001:4001'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - /app/node_modules
      # Private uploaded files — kept inside the container, never published.
      - uploads_data:/opt/gold/data/uploads
    command: pnpm --filter @gold/api dev

  # ─────────────────────────────────────────
  # Next.js Web
  # ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: gold_web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '4000:4000'
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - /app/node_modules

volumes:
  postgres_data:
  uploads_data:
