services:
  # ─────────────────────────────────────────
  # PostgreSQL — primary database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gold_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gold_db
      POSTGRES_USER: gold_user
      POSTGRES_PASSWORD: gold_pass
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gold_user -d gold_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # NestJS API
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: production
    container_name: gold_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 4001
      STORAGE_LOCAL_ROOT: /opt/gold/data/uploads
      DATABASE_URL: postgresql://gold_user:gold_pass@postgres:5432/gold_db?schema=public
    ports:
      - '4001:4001'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/opt/gold/data/uploads

  # ─────────────────────────────────────────
  # Next.js Web
  # ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: production
    container_name: gold_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 4000
    ports:
      - '4000:4000'
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data: